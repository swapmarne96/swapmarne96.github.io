name: Selenium Java UI Tests

on:
  push:
    paths:
      - "selenium-java-ui-automation-framework/**"
      - ".github/workflows/selenium-ui-tests.yml"
  pull_request:
    paths:
      - "selenium-java-ui-automation-framework/**"
      - ".github/workflows/selenium-ui-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: selenium-java-ui-automation-framework
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run Selenium tests with headless Chrome
        run: mvn --batch-mode --no-transfer-progress clean test -Dheadless=true

      - name: Upload test reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-ui-test-reports
          path: |
            selenium-java-ui-automation-framework/target/surefire-reports/
            selenium-java-ui-automation-framework/target/allure-results/
            selenium-java-ui-automation-framework/target/logs/
          if-no-files-found: warn
          retention-days: 14
